name: Publish Sakura Notes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_translation:
        description: Run an additional real translation smoke test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sakura-notes-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      current: ${{ steps.current.outputs.current }}
    env:
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_CHUNK_TYPE: MINISBD
      ARGOS_INTER_THREADS: '1'
      ARGOS_INTRA_THREADS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate parser and translation synchronization
        run: python -m unittest discover -s tests -v
      - name: Check changed definitions
        id: translations
        run: python sync_translations.py --check
      - name: Cache translation models
        if: steps.translations.outputs.pending != '0' || inputs.test_translation == true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
            ~/.cache/minisbd
          key: argos-en-pt-1.9-minisbd-1.11.0-v1
      - name: Install local translation engine
        if: steps.translations.outputs.pending != '0' || inputs.test_translation == true
        run: python -m pip install -r requirements-translation.txt
      - name: Exercise the real translation engine
        if: inputs.test_translation == true
        run: python tests/translation_smoke.py
      - name: Update translations and generate site
        run: |
          echo "BUILD_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python sync_translations.py
          python build_html.py --output _site/index.html
          python tests/check_site.py _site/index.html
          touch _site/.nojekyll
      - name: Save translations for future builds
        run: |
          set -euo pipefail
          git add -- glossary_pt-BR.json translation_state.json
          if ! git diff --cached --quiet; then
            git config user.name "sakura-notes[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Portuguese translations"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then pushed=true; break; fi
              sleep 2
            done
            test "$pushed" = true
          fi
      - name: Avoid publishing a superseded source
        id: current
        run: |
          git fetch origin main
          if git diff --quiet "$BUILD_SOURCE" origin/main -- . ':!glossary_pt-BR.json' ':!translation_state.json'; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the website only
        if: steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
